services:
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: example_api # Ignore this
      MYSQL_USER: appuser # Everyone else - appuser, BushyMustache - palm
      MYSQL_PASSWORD: apppassword # Everyone else - apppassword, BushyMustache - p@lmg@rd3n
    volumes:
      - c:/mysql-data:/var/lib/mysql
    ports:
      - "3306:3306" # Host port 3306 -> container port 3306
    
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
     - "8081:80" # Access phpMyAdmin at http://localhost:8081